name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }} · ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
        exclude:
          # Windows coverage matters (path handling), but one Node line is enough there.
          - os: windows-latest
            node: 24
          - os: macos-latest
            node: 24
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile=false

      - name: Configure git for the backend tests
        shell: bash
        run: |
          git config --global user.email "ci@dsh-sync.local"
          git config --global user.name "dsh-sync ci"
          git config --global init.defaultBranch main

      - name: Build (vendor the core into each package)
        run: node scripts/build.mjs

      - name: Unit and integration tests
        run: node --test packages/*/test/*.test.js

      - name: Plugin manifest and view check
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: node scripts/check-plugin.mjs

      - name: Repository hygiene (no secrets, links resolve, JSON parses)
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: node scripts/check-repo.mjs

  market:
    name: market index
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm add --global @deepseek-ai/dsh-plugin-market-index@0.2.2-rc.1 || true
      - run: node scripts/build-market.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: market-index
          path: site/market-index.json
